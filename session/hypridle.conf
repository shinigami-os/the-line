# The Line: idle. Dim at 10 min, lock at 30, suspend at 1 h.
# The screens are never turned off (not even once locked), and there is no hibernation.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

listener {
    timeout = 3600
    on-timeout = loginctl suspend
}
