# foot, with The Line's defaults (copied at your first login). Yours: The Line and its updates never overwrite it.
term=xterm-256color
shell=/bin/zsh

title=foot

font=JetBrainsMono Nerd Font:size=11
letter-spacing=0
dpi-aware=no

pad=25x25

bold-text-in-bright=no

[colors-dark]
# The Line: pure black, as glass (the compositor blurs what is behind it)
background=000000
foreground=ece8e1
alpha=0.70
selection-background=9a5cff
selection-foreground=0f0d12

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5

[key-bindings]
# Shortcuts as in VS Code's integrated terminal (Linux defaults):
scrollback-up-page=Page_Up Shift+Page_Up
scrollback-down-page=Page_Down Shift+Page_Down
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down
scrollback-home=Shift+Home
scrollback-end=Shift+End
# Previous / next command: needs the shell to mark its prompts (POWERLEVEL9K_TERM_SHELL_INTEGRATION=true in ~/.zshrc)
prompt-prev=Control+Up
prompt-next=Control+Down
clipboard-copy=Control+c
clipboard-paste=Control+v
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c
# Delete the previous / next word with the bytes VS Code sends (^W, ESC d)
\x17=Control+BackSpace
\x1bd=Control+Delete
